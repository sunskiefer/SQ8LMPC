# SQ8LMPC -- page layout for mpc-vst-plugins (tab + Q-Links only). tools/panel_art.py builds every control from
# layout.json and the original art; the knob lines below only name the parameters each Q-Link page reaches.
theme_bg=0e0e0e
theme_panel=0e0e0e
theme_ink=ececec
theme_ink_dim=cfcfcf
theme_accent=3ad06a
theme_knob_ring=3ad06a
theme_seg_active=3ad06a

[tab PANEL]
knob cx=24 cy=110 r=12 label="" key=k0 ns=0 bw=30
knob cx=58 cy=110 r=12 label="" key=k1 ns=0 bw=30
knob cx=92 cy=110 r=12 label="" key=k2 ns=0 bw=30
knob cx=126 cy=110 r=12 label="" key=k3 ns=0 bw=30
knob cx=160 cy=110 r=12 label="" key=k4 ns=0 bw=30
knob cx=194 cy=110 r=12 label="" key=k5 ns=0 bw=30
knob cx=228 cy=110 r=12 label="" key=k6 ns=0 bw=30
knob cx=262 cy=110 r=12 label="" key=k7 ns=0 bw=30
knob cx=296 cy=110 r=12 label="" key=k8 ns=0 bw=30
knob cx=330 cy=110 r=12 label="" key=k9 ns=0 bw=30
knob cx=364 cy=110 r=12 label="" key=b_up ns=0 bw=30
knob cx=398 cy=110 r=12 label="" key=b_down ns=0 bw=30
knob cx=432 cy=110 r=12 label="" key=b_bank ns=0 bw=30
